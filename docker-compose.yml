services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-supermarket}
      MYSQL_DATABASE: supermarket
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-supermarket}
      DB_NAME: supermarket
      PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/public/uploads

volumes:
  db-data:
  uploads:
