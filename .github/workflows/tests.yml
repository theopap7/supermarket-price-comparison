name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      SESSION_SECRET: ci-session-secret

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Build and start the app with its database
        run: docker compose up -d --build --wait
      - name: Create the tables and demo data
        run: docker compose exec -T app npm run seed
      - name: Check that the login page answers
        run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3001/login
      - name: Show the logs if something failed
        if: failure()
        run: docker compose logs
